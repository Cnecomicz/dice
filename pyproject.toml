[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dice"
version = "0.0.1"
authors = [
  {name="Eric", email="eric@locallyringed.space"}
]
description = "An engine and library for handling dice mechanics in video games."
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-testmon>=2.2.0",
  "pytest-xdist>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/Cnecomicz/dice"
Issues = "https://github.com/Cnecomicz/dice/issues"

[project.scripts]

[tool.hatch.build.targets.wheel]
packages = [
  "src/dice_model",
  "src/dice_roller",
]
